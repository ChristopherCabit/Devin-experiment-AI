# Single always-small machine; SQLite lives on the volume.
primary_region = "iad"

[build]

[env]
  DB_PATH = "/data/game.db"
  PORT = "8080"
  MONTHLY_CAP_USD = "14"

[mounts]
  source = "game_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
