<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./style.css">
<title>Adventure</title>
</head>
<body>
<section id="app" hidden>
  <header>
    <span id="title"></span>
    <span id="status"></span>
    <nav>
      <button data-tab="play" class="active">Play</button>
      <button data-tab="cast">Edit</button>
      <button data-tab="world">World</button>
    </nav>
  </header>

  <main id="tab-play" class="tab">
    <div id="story"></div>
    <p id="interpreted" class="msg"></p>
    <form id="turn-form">
      <div class="modes">
        <label><input type="radio" name="kind" value="do" checked>Do</label>
        <label><input type="radio" name="kind" value="say">Say</label>
        <label><input type="radio" name="kind" value="story">Story</label>
        <label><input type="radio" name="kind" value="continue">Continue</label>
      </div>
      <textarea id="input" rows="2" placeholder="What do you do?"></textarea>
      <div class="row">
        <button type="button" id="btn-undo">Undo</button>
        <button type="button" id="btn-retry">Retry</button>
        <button type="submit" id="btn-send" class="primary">Send</button>
      </div>
    </form>
  </main>

  <main id="tab-cast" class="tab" hidden>
    <select id="entity-select"></select>
    <label>Name <input id="entity-name"></label>
    <label>Aliases (comma separated) <input id="entity-aliases"></label>
    <label>Properties (JSON) <textarea id="entity-props" rows="18" spellcheck="false"></textarea></label>
    <div class="row"><button id="btn-entity-save" class="primary">Save</button></div>
    <h3>Add</h3>
    <div class="row">
      <select id="new-kind"><option>character</option><option>item</option><option>container</option><option>room</option></select>
      <input id="new-name" placeholder="Name">
    </div>
    <input id="new-parent" placeholder="Parent id (e.g. room:common)">
    <div class="row"><button id="btn-entity-add">Create</button></div>
    <h3>Secrets</h3>
    <label class="check"><input type="checkbox" id="show-spoilers"> Show spoilers</label>
    <div id="secrets-list" class="msg"></div>
    <p id="cast-msg" class="msg"></p>
  </main>

  <main id="tab-new" class="tab" hidden>
    <h3>New adventure</h3>
    <label>Save name <input id="n-name" value="New adventure"></label>
    <label>Start from
      <select id="n-template"><option value="custom">Scratch</option><option value="starter">The Lantern Inn (starter world)</option></select>
    </label>
    <div id="n-custom">
      <label>Title <input id="n-title" placeholder="Untitled"></label>
      <label>Premise <textarea id="n-premise" rows="4" placeholder="Setting, tone, genre, what the story is about"></textarea></label>
      <label>Starting situation <textarea id="n-situation" rows="3" placeholder="Where you are and what is happening as it begins"></textarea></label>
      <div class="row"><input id="n-place" placeholder="Starting place (Blank)"><input id="n-room" placeholder="Room / spot (Blank)"></div>
      <label>Content intensity <select id="n-intensity"><option value="explicit">explicit</option><option value="mild">mild</option><option value="none">none</option></select></label>
      <label>Hard limits <input id="n-limits"></label>
      <label>Death policy <select id="n-deathPolicy"><option>consequence</option><option>checkpoint</option><option>narrative</option><option>ironman</option></select></label>
      <label>World power, 1 (peasant drama) to 10 (demigods) <input id="n-power" type="number" min="1" max="10" value="6"></label>
      <label class="check"><input type="checkbox" id="n-unbounded"> Unbounded power: no stat cap or point budget for you (godlike play)</label>
      <label class="check"><input type="checkbox" id="n-npcs" checked> Generate NPCs (off: you start alone)</label>
      <h3>Progression</h3>
      <label class="check"><input type="checkbox" id="n-prog-practice" checked> Practice: skills improve with use</label>
      <label class="check"><input type="checkbox" id="n-prog-mentors" checked> Mentors: characters can train you up to their level</label>
      <label>Cultivation realms, lowest first, one per line (empty = none) <textarea id="n-prog-realms" rows="3"></textarea></label>
      <label>Cultivation resource (optional) <input id="n-prog-resource" placeholder="spirit stones"></label>

      <div class="row"><button id="btn-n-generate">Generate world</button><button id="btn-n-blank">Blank world</button></div>
      <div id="n-draft" hidden>
        <label>Opening <textarea id="n-opening" rows="6"></textarea></label>
        <p id="n-places" class="msg"></p>
        <div id="n-npc-list"></div>
      </div>
      <h3>Your character</h3>
      <label>Name <input id="n-pname"></label>
      <label>Age <input id="n-age" type="number" min="18" value="25"></label>
      <label>Description <textarea id="n-desc" rows="3" placeholder="Appearance, background, what you are good and bad at"></textarea></label>
      <div class="modes">
        <label><input type="radio" name="statsMode" value="pointbuy" checked>Point-buy</label>
        <label><input type="radio" name="statsMode" value="proposed">AI proposes</label>
        <label><input type="radio" name="statsMode" value="freeform">Freeform</label>
      </div>
      <div class="row"><button id="btn-n-propose">Propose stats from description</button></div>
      <div class="grid4">
        <label>Strength <input id="n-a-strength" type="number" min="0" max="10" value="3"></label>
        <label>Agility <input id="n-a-agility" type="number" min="0" max="10" value="3"></label>
        <label>Wits <input id="n-a-wits" type="number" min="0" max="10" value="3"></label>
        <label>Charm <input id="n-a-charm" type="number" min="0" max="10" value="3"></label>
      </div>
      <label>Skills <input id="n-skills" placeholder="swordsmanship 4, stealth 2"></label>
      <label>Abilities (cost double) <input id="n-abilities" placeholder="fire magic 2"></label>
      <p id="n-points" class="msg"></p>
      <div class="grid4">
        <label>HP <input id="n-hp" type="number" min="1" value="10"></label>
        <label>Coin <input id="n-coin" type="number" min="0" value="5"></label>
      </div>
      <label>Starting items <input id="n-items" placeholder="knife, cloak, rope"></label>
    </div>
    <div class="row"><button id="btn-n-cancel">Cancel</button><button id="btn-n-start" class="primary">Start</button></div>
    <p id="n-msg" class="msg"></p>
  </main>

  <main id="tab-world" class="tab" hidden>
    <h3>Saves</h3>
    <div id="saves"></div>
    <input id="save-name" placeholder="Name (for Duplicate)">
    <div class="row">
      <button id="btn-save-new">New adventure</button>
      <button id="btn-save-dup">Duplicate current</button>
      <button id="btn-save-import">Import</button>
    </div>
    <h3>This world</h3>
    <label>Title <input id="s-title"></label>
    <label>Premise <textarea id="s-premise" rows="6"></textarea></label>
    <label>Style <textarea id="s-style" rows="3"></textarea></label>
    <label>Content intensity
      <select id="s-intensity"><option value="none">none</option><option value="mild">mild</option><option value="explicit">explicit</option></select>
    </label>
    <label>Hard limits <textarea id="s-limits" rows="2"></textarea></label>
    <label>Death policy
      <select id="s-deathPolicy"><option>consequence</option><option>checkpoint</option><option>narrative</option><option>ironman</option></select>
    </label>
    <label>World power (1-10) <input id="s-powerCeiling" type="number" min="1" max="10"></label>
    <label>NPC inner thoughts (0 off, 2 normal, 5 a lot; each character scaled by their mind, personality and "thoughtfulness") <input id="s-thoughtsPerTurn" type="number" min="0" max="5"></label>
    <label class="check"><input type="checkbox" id="s-unboundedPower"> Unbounded power (godlike play)</label>
    <label class="check"><input type="checkbox" id="s-prog-practice" checked> Practice: skills improve with use</label>
      <label class="check"><input type="checkbox" id="s-prog-mentors" checked> Mentors: characters can train you up to their level</label>
      <label>Cultivation realms, lowest first, one per line (empty = none) <textarea id="s-prog-realms" rows="3"></textarea></label>
      <label>Cultivation resource (optional) <input id="s-prog-resource" placeholder="spirit stones"></label>
    <label>Narrator model <input id="s-narratorModel"></label>
    <label>Parser model <input id="s-parserModel"></label>
    <label>Context tokens <input id="s-contextTokens" type="number" min="4000" max="128000" step="1000"></label>
    <div class="row"><button id="btn-settings-save" class="primary">Save</button></div>
    <p id="sheet"></p>
    <h3>App settings</h3>
    <label>OpenRouter API key <input id="cfg-key" type="password" autocomplete="off" placeholder="sk-or-…"></label>
    <label>Monthly spend cap (USD) <input id="cfg-cap" type="number" min="0" step="1"></label>
    <div class="row"><button id="btn-cfg-save">Save app settings</button><button id="btn-cfg-clear" class="danger">Remove key</button></div>
    <p id="spend"></p>
    <p id="world-msg" class="msg"></p>
  </main>
</section>
<p id="boot-msg" class="msg">Loading…</p>
<script type="module" src="./main.ts"></script>
</body>
</html>
